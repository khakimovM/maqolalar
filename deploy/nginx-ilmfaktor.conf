# ============================================================
# ilmfaktor.uz — host nginx reverse proxy
# Konteynerlar 127.0.0.1 da (frontend:3001, admin:3002, backend:3000).
# SSL (listen 443 + sertifikat + redirect) certbot tomonidan avtomatik qo'shiladi.
#   /etc/nginx/sites-available/ilmfaktor  ga qo'ying va sites-enabled ga link qiling.
# ============================================================

# WebSocket (socket.io) upgrade uchun
map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

# ---- Frontend: ilmfaktor.uz (+ www) ----
server {
  listen 80;
  server_name ilmfaktor.uz www.ilmfaktor.uz;

  location / {
    proxy_pass http://127.0.0.1:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
  }
}

# ---- Admin: admin.ilmfaktor.uz ----
server {
  listen 80;
  server_name admin.ilmfaktor.uz;

  location / {
    proxy_pass http://127.0.0.1:3002;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
  }
}

# ---- Backend API + WebSocket: api.ilmfaktor.uz ----
server {
  listen 80;
  server_name api.ilmfaktor.uz;

  # Rasm yuklash uchun (backend BODY_LIMIT bilan mos)
  client_max_body_size 6m;

  location / {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
  }
}
